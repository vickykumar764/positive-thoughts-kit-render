<!doctype html><html><body style="margin:0;background:#e8d5a8">
<canvas id="c" width="2400" height="2200"></canvas>
<script type="module">
import * as T from "./toon.js"; import * as C from "./castdefs.js";
const g = document.getElementById("c").getContext("2d");
const cell = (i, j, fn, w = 600, h = 1000) => { g.save(); g.translate(i * 480 - 60, j * 1080 + 40); g.scale(0.8, 0.8); g.translate((600 - w) / 2, 1000 - h); fn(new T.Pen(g)); g.restore(); };
const L = -Math.PI * 2 / 3;
cell(0, 0, (p) => T.bodyFrontX(p, C.SADHU, { expr: "smile", armR: "point", seed: 3, light: L }));
cell(1, 0, (p) => T.bodyFrontX(p, C.MAN_A, { expr: "smile", armR: "chin", seed: 11, light: L }));
cell(2, 0, (p) => T.bodyFrontX(p, C.MAN_B, { expr: "smile", armR: "belly", seed: 13, light: L }));
cell(3, 0, (p) => T.bodyFrontX(p, C.MAN_C, { expr: "grin", armR: "up", seed: 15, light: L }));
cell(4, 0, (p) => T.bodyFrontX(p, C.MAN_A, { expr: "neutral", armR: "hang", seed: 11, light: L }));
cell(0, 1, (p) => T.bodyFrontX(p, C.VIL_A, { expr: "neutral", armL: "hang", armR: "hang", seed: 17, light: L }));
cell(1, 1, (p) => T.bodyFrontX(p, C.VIL_B, { expr: "smile", armR: "up", seed: 9, light: L }));
cell(2, 1, (p) => T.bodyFrontX(p, C.VIL_C, { expr: "grin", armL: "hip", armR: "point", seed: 11, light: L }));
cell(3, 1, (p) => T.bodySideX(p, C.MAN_A, { mode: "walk", phase: 0.2, expr: "neutral", seed: 11, light: L }));
cell(4, 1, (p) => T.bodySideX(p, C.MAN_C, { mode: "walk", phase: 0.6, expr: "smile", seed: 15, light: L }));
window.done = true;
</script></body></html>
