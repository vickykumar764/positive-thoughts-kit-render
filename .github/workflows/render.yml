name: Render kit frames
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            range: "0-72"
            count: 73
          - shard: 1
            range: "73-145"
            count: 73
          - shard: 2
            range: "146-218"
            count: 73
          - shard: 3
            range: "219-291"
            count: 73
          - shard: 4
            range: "292-364"
            count: 73
          - shard: 5
            range: "365-437"
            count: 73
          - shard: 6
            range: "438-510"
            count: 73
          - shard: 7
            range: "511-583"
            count: 73
          - shard: 8
            range: "584-656"
            count: 73
          - shard: 9
            range: "657-729"
            count: 73
          - shard: 10
            range: "730-802"
            count: 73
          - shard: 11
            range: "803-875"
            count: 73
          - shard: 12
            range: "876-948"
            count: 73
          - shard: 13
            range: "949-1021"
            count: 73
          - shard: 14
            range: "1022-1094"
            count: 73
          - shard: 15
            range: "1095-1167"
            count: 73
          - shard: 16
            range: "1168-1240"
            count: 73
          - shard: 17
            range: "1241-1313"
            count: 73
          - shard: 18
            range: "1314-1386"
            count: 73
          - shard: 19
            range: "1387-1446"
            count: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: npm install playwright@1.65.0
      - name: Install three.js
        run: cd web && npm ci
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Render shard
        run: node render.mjs frames "${{ matrix.range }}"
      - name: Verify frame count
        run: |
          n=$(ls frames/*.jpg | wc -l)
          echo "rendered $n frames, expected ${{ matrix.count }}"
          test "$n" -eq "${{ matrix.count }}"
      - name: Upload frames
        uses: actions/upload-artifact@v4
        with:
          name: kit-frames-shard-${{ matrix.shard }}
          path: frames/
          if-no-files-found: error
          retention-days: 2
